name: Créditer les profits journaliers
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  credit-profits:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le webhook
        run: |
          curl -f --max-time 60 --retry 3 --retry-delay 10 \
          "https://kts-app.com/webhook-profits.php?token=${{ secrets.WEBHOOK_TOKEN }}"
