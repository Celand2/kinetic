name: Créditer les profits journaliers

on:
  schedule:
    # Toutes les heures — la commande crédite uniquement si 24h se sont écoulées
    - cron: '0 * * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

jobs:
  credit-profits:
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter au serveur et exécuter la commande
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" \
              "cd /home/clients/f9034963984a19d989aa24c060236869/sites/kinetic && php artisan profits:credit"
          rm -f /tmp/deploy_key
